name: SafeVision · Build & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION:      us-east-2
  ECR_REGISTRY:    950639282365.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY:  safevision
  EB_APP_NAME:     safevision
  EB_ENV_NAME:     safevision-prod

jobs:
  build-and-deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest

    steps:
      # 1 ── Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 ── Configure AWS credentials (stored as GitHub secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-2

      # 3 ── Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4 ── Build Docker image and push to ECR
      - name: Build and push Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 5 ── Generate Dockerrun.aws.json for Elastic Beanstalk
      - name: Generate Dockerrun.aws.json
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > Dockerrun.aws.json << EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Authentication": {
              "Bucket": "elasticbeanstalk-us-east-2-950639282365",
              "Key": "docker-credentials"
            },
            "Image": {
              "Name": "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
              "Update": "true"
            },
            "Ports": [
              { "ContainerPort": 8000, "HostPort": 80 }
            ]
          }
          EOF

      # 6 ── Zip the deployment bundle
      - name: Create deployment bundle
        run: zip -r deploy.zip Dockerrun.aws.json

      # 7 ── Upload bundle to S3 (Elastic Beanstalk lo necesita)
      - name: Upload bundle to S3
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws s3 cp deploy.zip \
            s3://elasticbeanstalk-us-east-2-950639282365/safevision/deploy-$IMAGE_TAG.zip

      # 8 ── Create new Elastic Beanstalk application version
      - name: Create EB application version
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name $EB_APP_NAME \
            --version-label $IMAGE_TAG \
            --source-bundle S3Bucket=elasticbeanstalk-us-east-2-950639282365,S3Key=safevision/deploy-$IMAGE_TAG.zip \
            --region $AWS_REGION

      # 9 ── Deploy to Elastic Beanstalk environment
      - name: Deploy to Elastic Beanstalk
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws elasticbeanstalk update-environment \
            --application-name $EB_APP_NAME \
            --environment-name $EB_ENV_NAME \
            --version-label $IMAGE_TAG \
            --region $AWS_REGION

      # 10 ── Wait for deployment to complete
      - name: Wait for environment to be ready
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name $EB_APP_NAME \
            --environment-name $EB_ENV_NAME \
            --region $AWS_REGION

      # 11 ── Print deployment URL
      - name: Print app URL
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name $EB_APP_NAME \
            --environment-name $EB_ENV_NAME \
            --query "Environments[0].CNAME" \
            --output text \
            --region $AWS_REGION
